services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: parlor
      POSTGRES_PASSWORD: parlor
      POSTGRES_DB: parlor_prod
    volumes:
      - parlor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parlor -d parlor_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/kevingomez93/parlor:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    ports:
      - "4000:4000"
    command: ["/bin/sh", "-c", "/app/bin/migrate && /app/bin/server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  parlor_postgres_data:
